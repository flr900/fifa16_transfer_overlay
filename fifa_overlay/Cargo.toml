[package]
name = "fifa_overlay"
version = "0.1.0"
edition = "2021"

[lib]
name = "fifa_overlay"
crate-type = ["cdylib"]

[dependencies]
hudhook = { version = "0.9", features = ["dx11"] }
imgui = "0.12"
# Dependência direta só para o build.rs receber `DEP_IMGUI_*` (pasta e
# #defines do Dear ImGui) e compilar o rasterizador FreeType (2.2-v5).
imgui-sys = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
memchr = "2.7"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.26", features = ["v4", "serde"] }
dirs = "7.0"

[build-dependencies]
cc = "1"

[dev-dependencies]
# Só para o teste de nitidez das fontes gravar PNGs (target/nitidez).
png = "0.17"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_ProcessStatus",
  "Win32_System_LibraryLoader",
  "Win32_Storage_FileSystem",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_XboxController",
]

[profile.release]
debug = true
