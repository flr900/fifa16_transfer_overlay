; Histórico de versões que o instalador oferece (mais nova primeiro).
;
; Cada seção é o id da build (o texto antes do " — " em BUILD_TAG, em
; fifa_overlay\src\lib.rs). A DLL da versão tem de estar arquivada em
; installer\versoes\<id>\fifa_overlay.dll: build_installer.ps1 arquiva a
; build atual a cada execução. Versões sem DLL arquivada ficam de fora
; (com um aviso). A pasta installer\versoes\ não vai para o git.
;
; Campos: Titulo, Data (AAAA-MM-DD), Notas (\n = quebra de linha).

