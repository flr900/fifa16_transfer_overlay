[7.6-v12]
Titulo=Conhecimento do FIFA só para quem a Central conhece
Data=2026-10-08
Notas=O jogo marca conhecimento máximo até em jogadores que você nunca viu, então isso não entra mais na Base por conta própria.\nSó vale para quem a Central já conhece (Escolhidos, Relatórios dos Olheiros, o que já foi mapeado): se o FIFA sabe mais de um Escolhido do que a Central mostra (um olheiro do FIFA observou antes ou depois), o Escolhido sobe para o nível do jogo; se o FIFA conhece por inteiro um jogador que um Olheiro da Central encontrou, ele passa a valer completo na Base.\nA Central confere o conhecimento do jogo a cada poucos segundos e refaz a sincronização assim que algum nível muda ou aparece alguém novo na lista de escolhidos do FIFA.\nOs registros de Relatório do jogo de jogadores que a Central não conhece, que a versão anterior trouxe, são removidos da Base automaticamente.

[7.6-v11]
Titulo=L2/R2 nas posições, relatórios completos do jogo e foco no conteúdo
Data=2026-10-08
Notas=L2 e R2 trocam o grupo de posição das listas (Todos, Detalhados, Gol, Zag, Mei, Ata), pulando os grupos vazios.\nJogadores que o FIFA já conhece por inteiro (relatório completo, conhecimento no máximo) ficam completos e exatos na Central: os Escolhidos deles são atualizados e eles entram na Base como Relatório do jogo.\nO foco vai para o conteúdo principal (o primeiro card ou linha) ao abrir o painel, trocar de aba, voltar de uma tela e fechar um modal; os modais de filtros e configurações abrem no primeiro item, não no Fechar.

[7.6-v10]
Titulo=Ex-jogadores do clube e lista do jogo na Base do Scout
Data=2026-10-08
Notas=Na visão Tabular o D-pad agora anda de um cabeçalho para o outro e A ordena pela coluna (o cabeçalho era um item que bloqueava o →).\nQuando um jogador deixa o clube, ele vira registro da Base do Scout com os atributos que tinha ao sair (origem: Ex-jogador do clube). Enquanto está no clube, não aparece na Base. A Ficha dele abre normalmente e dá para adicioná-lo aos Escolhidos.\nA lista de escolhidos do próprio FIFA entra nos Escolhidos e na Base da Central, com a precisão que o conhecimento do jogo dá (198 = exato). Quem você tirar dos Escolhidos da Central não volta sozinho. Isso só vale com a sincronização com o FIFA ligada.

[7.6-v9]
Titulo=Configurações, carrossel de Olheiros e Relatórios por Olheiro
Data=2026-10-08
Notas=Relatórios agora só tem os Relatórios: Por Relatório ou Por Olheiro (cada Olheiro com os Relatórios dele), Ativos ou Arquivados. A lista de jogadores é a aba Base do Scout.\nNas listas de jogadores (Base, Escolhidos, Relatório aberto) Cards/Tabular, posição e filtros só mudam com o clique ou o A; passar o foco por cima não escolhe nada. A ordem sai do cabeçalho da Tabular e, nos Cards, do painel Y. Cards/Tabular subiu para a primeira linha.\nSelect abre as Configurações: Sincronizar com o FIFA (saiu da aba Escolhidos) e a visão Cards/Tabular de cada aba. Também há um botão na barra de abas.\nOlheiros viram um carrossel que ocupa a tela, com Contratar Olheiro como primeiro card; os cards mostram também o que cada habilidade faz.\nCards de Missões com o perfil pedido em itens separados (posição, idade, overall, potencial, contrato, ritmos, pé...).\nNova Missão lista primeiro os Olheiros livres, do mais experiente ao menos; os em contrato e os ocupados ficam embaixo, os ocupados em cinza.

[7.6-v8]
Titulo=Habilidades de Olheiro, Base do Scout, listas tabulares e Opções do Olheiro
Data=2026-10-08
Notas=Sonar removido.\nEscolhidos e Relatórios ganham visão tabular ordenável (time, país, valor, salário, contrato, idade, altura...) e filtros por posição (Todos, Detalhados, Gol, Zag, Mei, Ata); Y abre os filtros (potencial, overall, work rate, idade, pé, posição).\nNova aba Base do Scout: todo jogador que seus Olheiros já encontraram. Missões novas consultam a Base primeiro (0 a 4 dias, sem ocupar o limite do Olheiro, sem repetir). Relatórios agora lista por jogador, com o scout e a Missão; a lista de relatórios continua acessível.\nOlheiros em grade de cards verticais; Y abre as Opções: cancelar a pesquisa, ajustar o perfil, mudar de região (multa e Missão paga de novo) e demitir, com confirmação. Missões em cards verticais com tipo, região e perfil pedido.\nHabilidades de Olheiro: Fit Posicional, Jogador de Referência, Atributos Dominantes, Olho para Contratos, Perfil Físico e Caça a Promessas. Cada uma destrava filtros ou dados na busca; Olheiros de antes valem como se tivessem todas. Aparecem como selos nos cards e encarecem a contratação.\nO Fit Posicional deixou de ser uma posição única: com a habilidade, a busca inclui jogadores de outras posições com fit para as posições pedidas, cada um com a posição em que serve.

[7.6-v7]
Titulo=Contrato de 12 meses nas Missões contínuas
Data=2026-10-07
Notas=Missões contínuas viram um contrato de 12 meses: pago uma vez (3 vezes o preço da Missão de prazo fixo, bem menos que 12 pesquisas), com jogadores novos todo mês.\nNo fim dos 12 meses o contrato renova sozinho, havendo verba; sem verba ele fica vencido até você renovar ou encerrar. Dá para desligar a renovação sozinha por Missão.\nA multa de rescisão (um quinto do custo de contratação do Olheiro) vale só nos 12 primeiros meses, a carência: tirá-lo do contrato para outra localidade cobra a multa junto com a pesquisa nova. Depois dos 12 meses, nas renovações e na mesma localidade, sem multa.

[7.6-v5]
Titulo=Scout nativo, mercado semanal por continente, bandeiras e demissão de Olheiros
Data=2026-10-05
Notas=Escolhidos sincronizados com o scout nativo do jogo.\nMercado de Olheiros renovado toda semana, com filtro por continente (3 a 10 Olheiros em cada, mais onde há mais ligas relevantes), do mais raro ao mais comum, e com Olheiros de perfil médio além dos especialistas.\nBandeiras das nações e mercados nos cards de contratação, de Olheiros e da Nova Missão.\nDemitir Olheiro (com confirmação; não é possível durante uma Missão).\nNova Missão: Olheiro e estrelas à esquerda (compacto, sem rolagem), filtros à direita; atalhos de filtro retirados por ora.\nMissões cerca de 60% mais baratas; Escolhidos ficam exatos em até 25 dias.

